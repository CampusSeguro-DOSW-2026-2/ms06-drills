spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campusseguro_events}
    username: ${DB_USER:campusseguro}
    password: ${DB_PASSWORD:campusseguro}

app:
  security:
    local-jwt-secret: ${JWT_LOCAL_SECRET:campusseguro-local-secret-key-change-me-0123456789}

logging:
  level:
    edu.escuelaing.campusseguro.events: DEBUG
