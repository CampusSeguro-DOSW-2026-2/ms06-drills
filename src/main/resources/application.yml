spring:
  application:
    name: ms06-events
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      # Runs schema.sql on every startup (no Flyway); it is idempotent.
      mode: always
  task:
    scheduling:
      # Several threads, so a slow call to BEI does not delay the start of events.
      pool:
        size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8083}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  scheduling:
    # false turns off the scheduled jobs (tests do it).
    enabled: ${SCHEDULING_ENABLED:true}
  events:
    # How often the system looks for events to start, in milliseconds.
    start-check-ms: ${EVENT_START_CHECK_MS:10000}
    # How often the brigadiers are copied from BEI: events in progress and scheduled events.
    bei-sync-running-ms: ${BEI_SYNC_RUNNING_MS:10000}
    bei-sync-scheduled-ms: ${BEI_SYNC_SCHEDULED_MS:30000}
  clients:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    service-token: ${SERVICE_TOKEN:}
    ms01-url: ${MS01_URL:http://localhost:8081}
    ms02-url: ${MS02_URL:http://localhost:8082}
    ms03-url: ${MS03_URL:http://localhost:8080}
    ms04-url: ${MS04_URL:http://localhost:8084}
    ms05-url: ${MS05_URL:http://localhost:8085}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}

# JWT validation outside the local profile (waiting for MS01 data).
# Set it with properties or environment variables, for example:
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=https://<ms01>/.well-known/jwks.json
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://<ms01>
# Not declared here so startup does not fail with empty values.
