name: CI - calidad y contenedor

# A push to develop is not listed here: deploy.yml calls this workflow (workflow_call) and then deploys,
# so the tests do not run twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Java - pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests, integration tests (Testcontainers starts its own PostgreSQL;
      # Docker is already available on ubuntu-latest) and the JaCoCo check (>= 80 % lines).
      - name: Compilar + pruebas + cobertura
        run: mvn -B -ntp clean verify

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms06-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ms06-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  docker-image:
    name: Imagen Docker (se publica en GHCR solo desde main)
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # Only a push to main publishes the image; pull requests and develop only check that it builds.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identificadores de imagen
        id: meta
        shell: bash
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir (y publicar si es main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
