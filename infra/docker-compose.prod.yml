# MS06 - Events on the Azure VM (test or production).
# The database does NOT live in this stack: it is a managed instance (RDS) outside the VM, reached through
# its endpoint with TLS. It is started by infra/deploy.sh, which sets ENV and the variables below.
# No port is published: only the Caddy edge container (network "campus-edge") reaches MS06.
services:
  ms06:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ms06-events:${ENV}
    container_name: ms06-${ENV}
    restart: unless-stopped
    environment:
      # "prod" is any profile other than local/test: it turns on the Gateway identity headers
      # and the real clients (without it the service starts with the local stubs).
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8086"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      # Managed database (RDS). TLS is mandatory: with `rds.force_ssl=1` an unencrypted
      # connection is rejected, so the URL must carry `sslmode=require`.
      DB_URL: ${DB_URL:?DB_URL is required (jdbc:postgresql://<endpoint>:5432/<db>?sslmode=require)}
      DB_USER: ${DB_USER:?DB_USER is required (ms06_user or ms06_prod)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY}
      GATEWAY_SYSTEM_USER_ID: ${GATEWAY_SYSTEM_USER_ID:-}
      GATEWAY_SYSTEM_USER_PERMISSIONS: ${GATEWAY_SYSTEM_USER_PERMISSIONS:-}
      # Off at first: the calls to the other microservices are not integrated yet.
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-false}
    mem_limit: 768m
    networks:
      campus-edge:
        # The Caddy edge looks for this name (UPSTREAM_TEST=ms06-test:8086 / UPSTREAM_PROD=ms06-prod:8086).
        aliases: ["ms06-${ENV}"]

networks:
  campus-edge:
    external: true
